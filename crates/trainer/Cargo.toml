[package]
name = "trainer"
description = "Hand orchestration, AI opponents, preflop charts and solver-based review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Solves on an NVIDIA GPU (heads-up; three-player solves only through
# MultiSolver::use_gpu so far; needs the CUDA toolkit to build, see
# crates/solver/cuda/README.md). Off by default.
gpu = ["solver/gpu"]

[dependencies]
holdem.workspace = true
solver.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
